# Printer attributes for ippeveprinter (-a): the Canon LBP6030w as an IPP Everywhere / AirPrint printer.
# Note: with -a, ippeveprinter takes ALL printer attributes from this file (-f/-M/-m are not allowed with -a).
# Document formats are not listed here: ippeveprinter always advertises application/octet-stream, image/pwg-raster and
# image/urf itself (a second list would be a duplicate attribute). The command recognises PDF, JPEG, PNG, PWG Raster
# and URF by their content, so PDFs sent as application/octet-stream print too.
ATTR text printer-make-and-model "Canon LBP6030w (open printer app)"
ATTR keyword media-supported iso_a4_210x297mm,na_letter_8.5x11in,na_legal_8.5x14in,iso_a5_148x210mm,jis_b5_182x257mm,na_executive_7.25x10.5in,na_number-10_4.125x9.5in,iso_dl_110x220mm,iso_c5_162x229mm,na_monarch_3.875x7.5in,jpn_hagaki_100x148mm,jpn_oufuku_148x200mm,na_foolscap_8.5x13in,om_oficio_216x318mm,om_mexico-oficio_216x341mm,om_brazil-oficio_216x356mm,om_16k_195x270mm,om_4up-postcard_200x297mm,jpn_chou3_120x235mm
ATTR keyword media-default iso_a4_210x297mm
ATTR keyword media-ready iso_a4_210x297mm
ATTR keyword media-type-supported stationery,stationery-lightweight,stationery-heavyweight,cardstock,labels,transparency,envelope
ATTR keyword media-type-default stationery
ATTR integer media-bottom-margin-supported 500
ATTR integer media-left-margin-supported 500
ATTR integer media-right-margin-supported 500
ATTR integer media-top-margin-supported 500
ATTR keyword print-color-mode-supported monochrome
ATTR keyword print-color-mode-default monochrome
ATTR enum print-quality-supported 3,4,5
ATTR enum print-quality-default 4
ATTR resolution printer-resolution-supported 600dpi
ATTR resolution printer-resolution-default 600dpi
ATTR resolution pwg-raster-document-resolution-supported 600dpi
ATTR keyword pwg-raster-document-type-supported sgray_8
ATTR keyword pwg-raster-document-sheet-back normal
ATTR keyword urf-supported V1.4,W8,RS600,CP1,PQ3-4-5,MT1-2-3-4-5-6
ATTR keyword sides-supported one-sided
ATTR keyword sides-default one-sided
ATTR keyword multiple-document-handling-supported separate-documents-collated-copies,separate-documents-uncollated-copies
ATTR keyword print-scaling-supported auto,auto-fit,fit,none
ATTR keyword print-scaling-default auto
ATTR rangeOfInteger copies-supported 1-99
ATTR integer pages-per-minute 18
